# SCREEN Configuration - Retrieved 2026-06-02
# ============================================================
# vSRX1 (100.123.12.0) - Full SCREEN policy
# ============================================================

security {
    screen {
        ids-option untrust-screen {
            icmp {
                fragment;
                large;
                flood threshold 1000;
                ping-death;
            }
            ip {
                source-route-option;
                loose-source-route-option;
                strict-source-route-option;
                unknown-protocol;
                block-frag;
                tear-drop;
            }
            tcp {
                syn-fin;
                fin-no-ack;
                tcp-no-flag;
                port-scan threshold 5000;
                syn-flood {
                    alarm-threshold 1024;
                    attack-threshold 200;
                    source-threshold 1024;
                    destination-threshold 2048;
                    queue-size 2000;
                    timeout 20;
                }
                land;
                winnuke;
            }
            udp {
                flood {
                    threshold 1000;
                }
                port-scan threshold 5000;
            }
        }
    }
}

